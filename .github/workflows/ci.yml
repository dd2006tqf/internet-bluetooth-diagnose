name: CI

on:
  push:
    branches: [main, dev/**]
  pull_request:
    branches: [main, dev/**]

jobs:
  lint-and-check:
    name: 静态规范检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查行尾与非法字符
        run: |
          echo "检查是否有 Windows CRLF 换行符..."
          cr_files=$(git ls-files | grep -v -E '^(ci-reports|board-assets)/' | while IFS= read -r file; do
            if [ -f "$file" ] && grep -qP '\r$' "$file" 2>/dev/null; then
              echo "$file"
            fi
          done)
          if [ -n "$cr_files" ]; then
            echo "❌ 发现 CRLF 换行符，请使用 LF:"
            echo "$cr_files"
            exit 1
          fi
          echo "✅ 代码换行符检查通过"

      - name: 检查敏感配置或二进制提交
        run: |
          echo "检查仓库中是否有不当提交的大文件或二进制..."
          git ls-files | grep -E '\.(bin|so|o|a|log)$' | grep -v 'board-assets' && {
            echo "❌ 发现受限二进制/日志文件被跟踪提交"
            exit 1
          } || echo "✅ 仓库卫生检查通过"

      - name: Edge telemetry contract cross-language check
        run: |
          sudo apt-get install -y -qq python3 python3-pip
          # verify_telemetry_contract.py 虽然只要 contracts/copilot 两个模块，
          # 但 Python import 子模块会先执行包的 __init__.py，它级联加载
          # service → sqlalchemy/pgvector、signing → cryptography、
          # model_gateway → structlog/jsonschema/opentelemetry/prometheus-client/httpx。
          # 只装 pydantic 会在入口 ModuleNotFoundError（该步骤自 177bcaf 起即红）。
          # 清单是 venv 里逐轮复现到 `OK edge-telemetry-contract` 的最小直接依赖集；
          # 以后 __init__ 新增级联 import 时按同样的报错补包即可。
          python3 -m pip install --quiet \
            pydantic \
            sqlalchemy \
            pgvector \
            cryptography \
            structlog \
            jsonschema \
            opentelemetry-api \
            opentelemetry-sdk \
            prometheus-client \
            httpx
          python3 tools/verify_telemetry_contract.py --strict

  build-and-test:
    name: x86 编译与全量单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential cmake pkg-config \
            libdbus-1-dev libgoogle-glog-dev libbpf-dev \
            libsqlite3-dev libgtest-dev

      - name: CMake 配置
        run: cmake -B build-x86 -DCMAKE_BUILD_TYPE=Debug -DBUILD_EBPF=OFF

      - name: 编译
        run: cmake --build build-x86 -j$(nproc)

      - name: 运行全部单元测试
        run: ctest --test-dir build-x86 --output-on-failure
