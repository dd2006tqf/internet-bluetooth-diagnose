# CI: push 后的最终安全网
# 本地已验证通过，push 后跑 CI 作为二次保障
name: CI

on:
  push:
    branches: [main, dev/**]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential cmake pkg-config \
            libdbus-1-dev libgoogle-glog-dev libbpf-dev \
            libsqlite3-dev libgtest-dev

      - name: CMake 配置
        run: cmake -B build-x86 -DCMAKE_BUILD_TYPE=Debug -DBUILD_EBPF=OFF

      - name: 编译
        run: cmake --build build-x86 -j$(nproc) --target weaknet-dbus-server history_query_tool weaknet test_client_bin

      - name: 运行全部单元测试
        run: |
          PASS=0; FAIL=0
          for bin in build-x86/server/test/test_net_info \
                     build-x86/server/test/test_quality_assessor_gtest \
                     build-x86/server/test/test_anomaly_detector_gtest \
                     build-x86/server/test/test_audio_fusion_gtest \
                     build-x86/server/test/test_band_conflict_gtest \
                     build-x86/server/test/test_serializer_gtest \
                     build-x86/server/test/test_event_manager_gtest \
                     build-x86/server/test/test_bt_full_link_gtest \
                     build-x86/server/test/test_bt_monitor \
                     build-x86/server/test/test_iface_type_gtest \
                     build-x86/server/test/test_logger_gtest \
                     build-x86/server/test/test_traffic_analyzer_gtest \
                     build-x86/server/test/test_weak_netmgr_gtest \
                     build-x86/server/test/test_net_iface_gtest \
                     build-x86/server/test/test_rtt_monitor_gtest \
                     build-x86/server/test/test_bt_monitor_extra_gtest \
                     build-x86/server/test/test_jitter_monitor_gtest \
                     build-x86/server/test/test_dns_monitor_gtest \
                     build-x86/server/test/test_database_manager_gtest; do
            if [ -f "$bin" ]; then
              name=$(basename "$bin")
              if timeout 30 "$bin" >/dev/null 2>&1; then
                echo "✅ $name"
                PASS=$((PASS + 1))
              else
                echo "❌ $name"
                FAIL=$((FAIL + 1))
              fi
            fi
          done
          echo "---"
          echo "通过: $PASS / $((PASS + FAIL))"
          if [ "$FAIL" -gt 0 ]; then exit 1; fi
