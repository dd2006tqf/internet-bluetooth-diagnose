{{- include "industrial-ops-runtime-secrets.validate" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "industrial-ops-runtime-secrets.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.secretStore.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "industrial-ops-runtime-secrets.labels" . | nindent 4 }}
spec:
  controller: {{ .Values.controllerClass | quote }}
  provider:
    vault:
      server: {{ .Values.vault.server | quote }}
      path: {{ .Values.vault.path | quote }}
      version: {{ .Values.vault.version | quote }}
      caProvider:
        type: {{ .Values.vault.caProvider.type }}
        name: {{ .Values.vault.caProvider.name }}
        key: {{ .Values.vault.caProvider.key | quote }}
      auth:
        kubernetes:
          mountPath: {{ .Values.vault.auth.mountPath | quote }}
          role: {{ .Values.vault.auth.role | quote }}
          serviceAccountRef:
            name: {{ .Values.serviceAccount.name }}
            audiences:
              {{- toYaml .Values.vault.auth.audiences | nindent 14 }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecret.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "industrial-ops-runtime-secrets.labels" . | nindent 4 }}
spec:
  refreshPolicy: {{ .Values.refreshPolicy }}
  refreshInterval: {{ .Values.refreshInterval | quote }}
  secretStoreRef:
    kind: SecretStore
    name: {{ .Values.secretStore.name }}
  target:
    name: {{ .Values.target.name }}
    creationPolicy: {{ .Values.lifecycle.creationPolicy }}
    deletionPolicy: {{ .Values.lifecycle.deletionPolicy }}
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/part-of: industrial-ops-agent-platform
          app.kubernetes.io/managed-by: external-secrets
  data:
    {{- range .Values.mappings }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ $.Values.remote.key | quote }}
        property: {{ .remoteProperty | quote }}
    {{- end }}
