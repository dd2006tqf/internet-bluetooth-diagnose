{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.gateway.className }}
  labels:
    {{- include "industrial-ops-ai-platform.labels" . | nindent 4 }}
spec:
  controllerName: {{ .Values.gateway.controllerName }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Values.gateway.namespace }}
  labels:
    {{- include "industrial-ops-ai-platform.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: https
      hostname: {{ .Values.gateway.hostname | quote }}
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ .Values.gateway.tlsSecretName }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- if .Values.gateway.allowHttp }}
    - name: http
      hostname: {{ .Values.gateway.hostname | quote }}
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
{{- end }}
