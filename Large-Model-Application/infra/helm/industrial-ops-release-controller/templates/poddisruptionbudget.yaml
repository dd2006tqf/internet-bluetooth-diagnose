{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "industrial-ops-release-controller.name" . }}
  namespace: {{ .Values.releaseNamespace }}
  labels:
    {{- include "industrial-ops-release-controller.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "industrial-ops-release-controller.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
