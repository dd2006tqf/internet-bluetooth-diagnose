{{- if .Values.otelCollector.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: industrial-ops-otel-collector
  labels:
    app.kubernetes.io/name: industrial-ops-otel-collector
    app.kubernetes.io/part-of: industrial-ops-agent-platform
data:
  config.yaml: |-
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 5s
        limit_mib: {{ .Values.otelCollector.memoryLimitMiB }}
        spike_limit_mib: 64
      resource/ioap:
        attributes:
          - key: service.namespace
            value: industrial-ops
            action: upsert
      batch:
        timeout: 5s
        send_batch_size: 1024
    exporters:
      otlphttp/tempo:
        endpoint: {{ .Values.otelCollector.tempoEndpoint | quote }}
    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource/ioap, batch]
          exporters: [otlphttp/tempo]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: industrial-ops-otel-collector
  labels:
    app.kubernetes.io/name: industrial-ops-otel-collector
    app.kubernetes.io/part-of: industrial-ops-agent-platform
spec:
  replicas: {{ .Values.otelCollector.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: industrial-ops-otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: industrial-ops-otel-collector
        app.kubernetes.io/part-of: industrial-ops-agent-platform
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: "{{ .Values.otelCollector.image.repository }}:{{ .Values.otelCollector.image.tag }}"
          imagePullPolicy: {{ .Values.otelCollector.image.pullPolicy }}
          args: ["--config=/etc/otelcol-contrib/config.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: health
              containerPort: 13133
          readinessProbe:
            httpGet:
              path: /
              port: health
          livenessProbe:
            httpGet:
              path: /
              port: health
          resources:
            {{- toYaml .Values.otelCollector.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: industrial-ops-otel-collector
---
apiVersion: v1
kind: Service
metadata:
  name: industrial-ops-otel-collector
  labels:
    app.kubernetes.io/name: industrial-ops-otel-collector
    app.kubernetes.io/part-of: industrial-ops-agent-platform
spec:
  selector:
    app.kubernetes.io/name: industrial-ops-otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
{{- end }}
