{{- if .Values.workerServiceMonitors.enabled }}
{{- range .Values.workerServiceMonitors.workers }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: industrial-ops-{{ .name }}
  labels:
    app.kubernetes.io/name: industrial-ops-observability
    app.kubernetes.io/part-of: industrial-ops-agent-platform
spec:
  namespaceSelector:
    matchNames:
      - {{ $.Values.workerServiceMonitors.namespace | quote }}
  selector:
    matchLabels:
      {{- toYaml .serviceSelector | nindent 6 }}
  endpoints:
    - port: {{ .port | quote }}
      path: /metrics
      interval: {{ $.Values.workerServiceMonitors.interval | quote }}
      scrapeTimeout: {{ $.Values.workerServiceMonitors.scrapeTimeout | quote }}
      scheme: http
{{- end }}
{{- end }}
