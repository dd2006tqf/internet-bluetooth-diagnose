{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: industrial-ops-application
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "industrial-ops-application.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: https
      hostname: {{ .Values.gateway.hostname | quote }}
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ .Values.gateway.tlsSecretName }}
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: industrial-ops-application
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "industrial-ops-application.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: industrial-ops-application
      sectionName: https
  hostnames:
    - {{ .Values.gateway.hostname | quote }}
  rules:
    - backendRefs:
        - name: industrial-ops-web
          port: {{ .Values.services.web.port }}
{{- end }}

