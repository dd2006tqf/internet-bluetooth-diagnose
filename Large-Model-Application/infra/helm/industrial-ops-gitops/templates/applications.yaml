        apiServiceMonitor:
          enabled: {{ .Values.observability.apiServiceMonitorEnabled }}
          namespace: {{ .Values.application.namespace | quote }}
        workerServiceMonitors:
          enabled: {{ .Values.observability.workerServiceMonitorsEnabled }}
          namespace: {{ .Values.application.namespace | quote }}
        vllmRuntimePodMonitor:
          enabled: {{ .Values.observability.vllmRuntimePodMonitorEnabled }}
