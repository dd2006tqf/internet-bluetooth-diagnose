---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: industrial-ops-observability-stack-{{ .Values.environment }}
  namespace: {{ .Values.argocdNamespace }}
  {{- include "industrial-ops-gitops.applicationMetadata" (dict "root" . "tier" "observability-stack" "wave" "-25") | nindent 2 }}
