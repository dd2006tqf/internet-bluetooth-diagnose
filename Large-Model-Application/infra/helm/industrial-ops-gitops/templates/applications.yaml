    repoURL: {{ .Values.observability.repositoryUrl | quote }}
    chart: {{ .Values.observability.chart }}
    targetRevision: {{ .Values.observability.version | quote }}
    helm:
      releaseName: prometheus
      valuesObject:
        fullnameOverride: prometheus
        alertmanager:
          enabled: true
        grafana:
          enabled: true
          admin:
            existingSecret: {{ .Values.observability.grafanaAdminSecretName | quote }}
            userKey: admin-user
            passwordKey: admin-password
          sidecar:
            dashboards:
              enabled: true
              searchNamespace: ALL
        prometheus:
          prometheusSpec:
            retention: {{ .Values.observability.retention | quote }}
            ruleSelectorNilUsesHelmValues: false
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            storageSpec:
              volumeClaimTemplate:
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: {{ .Values.observability.storageSize | quote }}
  syncPolicy:
    {{- include "industrial-ops-gitops.syncPolicy" . | nindent 4 }}
