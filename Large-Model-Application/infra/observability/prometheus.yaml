global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: industrial-ops-api
    metrics_path: /metrics
    static_configs:
      - targets: [api:8000]
  - job_name: industrial-ops-workflow-worker
    static_configs:
      - targets: [workflow-worker:9101]
  - job_name: industrial-ops-event-worker
    static_configs:
      - targets: [event-worker:9102]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
