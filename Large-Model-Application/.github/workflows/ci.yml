name: M1 CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: m1-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks repository scan
        uses: gitleaks/gitleaks-action@v2

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.15"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.20.0 --activate
      - name: Install locked dependencies
        run: |
          uv sync --frozen --extra dev
          pnpm install --frozen-lockfile
      - name: Python lint and strict types
        run: |
          .venv/bin/ruff check src
          .venv/bin/mypy src
      - name: Edge telemetry contract verifier
        run: .venv/bin/python ../tools/verify_telemetry_contract.py --strict
      - name: OpenAPI generation drift
        run: |
          scripts/generate_openapi.sh --check
          scripts/generate_openapi_client.sh --check
      - name: Web types and production build
        working-directory: web
        run: |
          pnpm typecheck
          pnpm build
      - name: Vault provider and policy contract
        run: scripts/m1_verify.sh vault-config
      - name: AWS Terraform profile contract
        run: |
          scripts/terraform_aws_verify.sh static
          scripts/terraform_aws_verify.sh validate
      - name: Release controller Lease HA contract
        run: |
          scripts/release_controller_ha_verify.sh static
          scripts/release_controller_ha_verify.sh build
      - name: Core application Kubernetes HA and GitOps contract
        run: scripts/application_workloads_ha_verify.sh build
      - name: Core application metric autoscaling and KEDA contract
        run: scripts/core_application_autoscaling_verify.sh build
      - name: Vault External Secrets production delivery contract
        run: scripts/vault_external_secrets_verify.sh build

  compose-lite:
    needs: [quality, secret-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.15"
      - name: Install development dependencies
        run: uv sync --frozen --extra dev
      - name: Cold-start and verify Compose Lite
        run: scripts/m1_verify.sh compose-lite
      - name: Preserve non-sensitive service diagnostics
        if: failure()
        run: scripts/dev_lite.sh logs || true
      - name: Stop Lite stack
        if: always()
        run: scripts/dev_lite.sh clean || true
