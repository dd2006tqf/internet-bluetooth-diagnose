<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- WeakNet 网络诊断服务策略：服务端以 root 注册 com.example.WeakNet，
       本机用户（含 root）可调用其方法并接收其信号。
       安装位置：/etc/dbus-1/system.d/com.example.WeakNet.conf -->
  <!-- 仅 root 服务进程可以注册服务名；普通本地用户只能调用/接收信号，不能仿冒服务。 -->
  <policy user="root">
    <allow own="com.example.WeakNet"/>
    <allow send_destination="com.example.WeakNet" send_interface="com.example.WeakNet"/>
  </policy>
  <policy context="default">
    <!-- 客户端按需调用 WeakNet 方法，不开放对任意服务的泛化发送权限。 -->
    <allow send_destination="com.example.WeakNet" send_interface="com.example.WeakNet"/>
    <allow receive_sender="com.example.WeakNet" receive_interface="com.example.WeakNet"/>
  </policy>
</busconfig>
